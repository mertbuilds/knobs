name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      # The site bundles devknobs from its dist.
      - run: pnpm --filter @vinena/knobs build
      - name: Build and deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          # Public OpenPanel project id; unset means the site ships without analytics.
          VITE_OPENPANEL_CLIENT_ID: ${{ vars.OPENPANEL_CLIENT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          preCommands: pnpm build

  # Its own job, so the deploy job never holds an id-token.
  indexing:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Google sign-in for Search Console (keyless)
        id: gauth
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SA_EMAIL != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters
      - name: Tell search engines what changed
        continue-on-error: true
        uses: vinenastudio/deploy-indexing@bc5e796dd631dabf848c82bc02b8b243057a9532 # v1.0.2
        with:
          site-url: https://knobs.dev
          indexnow-key: 78542e187dcb354c241595d0ddb65792
          google-access-token: ${{ steps.gauth.outputs.access_token }}
