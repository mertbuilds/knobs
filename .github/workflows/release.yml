name: Release

# Publishes @vinena/knobs to npm through trusted publishing (OIDC): no npm token, and npm adds
# provenance on its own. Push a tag like `knobs@0.5.0` that matches packages/devknobs.

on:
  push:
    tags: ['knobs@*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-knobs
  cancel-in-progress: false

# No turbo remote cache here: a release always builds dist from source.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Check npm version
        run: |
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version
      - name: Check tag matches package version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#knobs@}"
          version="$(node -p 'require("./packages/devknobs/package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match packages/devknobs/package.json version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published="$(npm view "@vinena/knobs@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "::notice::@vinena/knobs@$version is already on npm. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: pnpm exec turbo run test typecheck build --filter=@vinena/knobs
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        working-directory: packages/devknobs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
