name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      # Includes devknobs' build and typecheck (bun, tsc).
      - run: pnpm exec turbo run lint typecheck build
      - run: pnpm format:check
      - run: pnpm skills:check
      - name: react-doctor
        run: npx -y react-doctor@0.9.13 --yes --no-telemetry --no-supply-chain --project apps/web,packages/ui .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      # Storybook story tests run in real Chromium (vitest browser mode).
      - run: pnpm --filter @knobs/ui exec playwright install chromium --with-deps
      # Storybook stories and devknobs' bun tests.
      - run: pnpm test
      # The extension loaded into the same Chromium (playwright-core 1.62.1), on local pages only.
      - run: pnpm --filter @vinena/knobs build && pnpm --filter @knobs/extension build && pnpm --filter @knobs/extension smoke
      # The smoke's screenshots, the two that differ among them.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out
          path: packages/extension/smoke-out
